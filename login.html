<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NiftyEdge Pro — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#050510;--card:rgba(8,12,40,.9);--cyan:#00f5ff;--purple:#7b2fff;
          --text:#ccd6f6;--dim:#8892b0;--border:rgba(0,245,255,.14)}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif}
    #bg{position:fixed;inset:0;z-index:0;pointer-events:none}

    .wrap{
      position:relative;z-index:1;min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:40px 20px;
    }

    /* Logo */
    .logo-area{text-align:center;margin-bottom:36px}
    .logo-row{display:inline-flex;align-items:center;gap:12px}
    .bolt{font-size:2.2rem;filter:drop-shadow(0 0 14px var(--cyan));animation:bp 2.2s ease-in-out infinite}
    @keyframes bp{0%,100%{filter:drop-shadow(0 0 14px var(--cyan))}
                  50%{filter:drop-shadow(0 0 28px var(--cyan)) drop-shadow(0 0 48px #00aaff)}}
    .logo-words{display:flex;flex-direction:column;line-height:1.1}
    .lm{font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;
        color:#fff;text-shadow:0 0 24px var(--cyan);letter-spacing:2px}
    .lp{font-family:'Orbitron',monospace;font-size:1.2rem;font-weight:700;letter-spacing:6px;
        background:linear-gradient(135deg,var(--cyan),var(--purple));
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .tagline{font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--dim);
             letter-spacing:3px;text-transform:uppercase;margin-top:10px}

    /* Auth box */
    .auth-box{
      width:100%;max-width:440px;
      background:var(--card);border-radius:22px;padding:40px 36px;
      border:1px solid var(--border);backdrop-filter:blur(28px);
      box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(0,245,255,.07);
      position:relative;overflow:hidden;
    }
    .auth-box::before{
      content:'';position:absolute;top:0;left:0;right:0;height:2px;
      background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);
      animation:tl 3s ease-in-out infinite;
    }
    @keyframes tl{0%,100%{opacity:.4}50%{opacity:1}}

    /* Tabs */
    .tabs{display:flex;position:relative;background:rgba(0,0,0,.35);border-radius:11px;
          padding:4px;margin-bottom:28px}
    .tab{flex:1;padding:10px;background:none;border:none;color:var(--dim);
         font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;letter-spacing:2px;
         cursor:pointer;border-radius:8px;transition:color .3s;position:relative;z-index:1}
    .tab.on{color:#fff}
    .slider{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
            background:linear-gradient(135deg,rgba(0,245,255,.12),rgba(123,47,255,.12));
            border:1px solid rgba(0,245,255,.22);border-radius:8px;
            transition:transform .3s cubic-bezier(.4,0,.2,1)}
    .slider.reg{transform:translateX(100%)}

    /* Inputs */
    .ig{position:relative;margin-bottom:15px}
    .ig-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.88rem;pointer-events:none;z-index:1}
    .ig input{
      width:100%;padding:14px 16px 14px 44px;
      background:rgba(0,0,0,.45);border:1px solid rgba(0,245,255,.13);border-radius:11px;
      color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;
      transition:border-color .25s,box-shadow .25s;
    }
    .ig input::placeholder{color:var(--dim)}
    .ig input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,245,255,.1),0 0 18px rgba(0,245,255,.07)}

    /* Submit */
    .sbtn{
      width:100%;padding:15px;margin-top:6px;
      background:linear-gradient(135deg,rgba(0,245,255,.13),rgba(123,47,255,.13));
      border:1px solid rgba(0,245,255,.28);border-radius:11px;color:#fff;
      font-family:'Orbitron',monospace;font-size:.82rem;font-weight:700;letter-spacing:3px;
      cursor:pointer;position:relative;overflow:hidden;transition:all .3s;
    }
    .sbtn::after{content:'';position:absolute;inset:0;
      background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);
      transform:translateX(-100%);transition:transform .5s}
    .sbtn:hover::after{transform:translateX(100%)}
    .sbtn:hover{background:linear-gradient(135deg,rgba(0,245,255,.24),rgba(123,47,255,.24));
                box-shadow:0 0 32px rgba(0,245,255,.18),0 0 64px rgba(123,47,255,.12);transform:translateY(-1px)}
    .sbtn:active{transform:translateY(0)}
    .sbtn:disabled{opacity:.5;cursor:not-allowed;transform:none}

    .ldots{display:inline-flex;gap:5px;align-items:center}
    .ldots span{width:6px;height:6px;background:#fff;border-radius:50%;animation:db 1.2s ease-in-out infinite}
    .ldots span:nth-child(2){animation-delay:.2s}.ldots span:nth-child(3){animation-delay:.4s}
    @keyframes db{0%,80%,100%{transform:scale(.55);opacity:.35}40%{transform:scale(1);opacity:1}}

    .emsg{color:#ff4466;font-size:.78rem;text-align:center;min-height:20px;margin-top:12px;letter-spacing:.4px}

    .back-link{
      margin-top:20px;text-align:center;font-family:'Share Tech Mono',monospace;
      font-size:.72rem;color:var(--dim);letter-spacing:1px;
    }
    .back-link a{color:var(--cyan);text-decoration:none;transition:text-shadow .3s}
    .back-link a:hover{text-shadow:0 0 10px var(--cyan)}

    @media(max-width:480px){.auth-box{padding:28px 20px}.lm{font-size:1.5rem}}
  </style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">

  <div class="logo-area">
    <div class="logo-row">
      <span class="bolt">⚡</span>
      <div class="logo-words">
        <span class="lm">NiftyEdge</span>
        <span class="lp">PRO</span>
      </div>
    </div>
    <p class="tagline">Real-Time NSE Options Intelligence</p>
  </div>

  <div class="auth-box">
    <div class="tabs">
      <div class="slider" id="slider"></div>
      <button class="tab on" id="tlg" onclick="sw('login')">LOGIN</button>
      <button class="tab"    id="trg" onclick="sw('register')">REGISTER</button>
    </div>

    <form id="af" onsubmit="go(event)">
      <div class="ig">
        <span class="ig-ico">👤</span>
        <input type="text"     id="u"  placeholder="Username"         autocomplete="username"         required>
      </div>
      <div class="ig">
        <span class="ig-ico">🔑</span>
        <input type="password" id="p"  placeholder="Password"         autocomplete="current-password" required>
      </div>
      <div class="ig" id="cpw" style="display:none">
        <span class="ig-ico">🔒</span>
        <input type="password" id="p2" placeholder="Confirm Password" autocomplete="new-password">
      </div>
      <button type="submit" class="sbtn" id="sb">
        <span id="st">LOGIN</span>
        <div class="ldots" id="ld" style="display:none"><span></span><span></span><span></span></div>
      </button>
    </form>
    <div class="emsg" id="em"></div>
  </div>

  <div class="back-link">← <a href="/">Back to home</a></div>
</div>

<script>
/* canvas */
(function(){
  const cv=document.getElementById('bg'),ctx=cv.getContext('2d');let W,H,pts=[];
  const C=['#00f5ff','#7b2fff','#00ff88'];
  function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
    pts=Array.from({length:Math.min(80,Math.floor(W*H/13000))},()=>mk(true))}
  function mk(init){return{x:init?Math.random()*W:-4,y:Math.random()*H,
    vx:(Math.random()-.5)*.45,vy:(Math.random()-.5)*.4,r:Math.random()*1.7+.6,
    c:C[Math.floor(Math.random()*C.length)],a:Math.random()*.5+.12}}
  function frame(){ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,245,255,0.03)';ctx.lineWidth=1;
    for(let x=0;x<W;x+=70){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
    for(let y=0;y<H;y+=70){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;
      if(p.x<-10||p.x>W+10||p.y<-10||p.y>H+10)Object.assign(p,mk(false));
      ctx.save();ctx.globalAlpha=p.a;ctx.shadowBlur=8;ctx.shadowColor=p.c;
      ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()});
    requestAnimationFrame(frame)}
  window.addEventListener('resize',resize);resize();frame();
})();

let TAB='login';
function sw(t){
  TAB=t;const isL=t==='login';
  document.getElementById('slider').className='slider'+(isL?'':' reg');
  document.getElementById('tlg').className='tab'+(isL?' on':'');
  document.getElementById('trg').className='tab'+(isL?'':' on');
  document.getElementById('cpw').style.display=isL?'none':'block';
  document.getElementById('st').textContent=isL?'LOGIN':'CREATE ACCOUNT';
  document.getElementById('em').textContent='';
}

async function go(e){
  e.preventDefault();
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const p2=document.getElementById('p2').value;
  const em=document.getElementById('em');
  em.textContent='';
  if(!u||!p){em.textContent='Username and password required';return}
  if(TAB==='register'){
    if(p.length<6){em.textContent='Password must be at least 6 characters';return}
    if(p!==p2){em.textContent='Passwords do not match';return}
  }
  setL(true);
  try{
    const ep=TAB==='login'?'/login':'/register';
    const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:u,password:p,role:'rookie'})});
    const d=await r.json();
    if(d.success){window.location.href='/hub'}
    else{em.textContent=d.error||'Something went wrong'}
  }catch(_){em.textContent='Connection error — please try again.'}
  finally{setL(false)}
}
function setL(on){
  document.getElementById('sb').disabled=on;
  document.getElementById('st').style.display=on?'none':'inline';
  document.getElementById('ld').style.display=on?'inline-flex':'none';
}
</script>
</body>
</html>
